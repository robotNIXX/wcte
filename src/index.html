<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Token Counter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <select id="model" aria-label="Model">
          <option value="claude-opus-4-7">Opus 4.7</option>
          <option value="claude-opus-4-6">Opus 4.6</option>
          <option value="claude-sonnet-4-6" selected>Sonnet 4.6</option>
          <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
        </select>
        <button id="settings-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
            <path d="M8 5.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5zm6.93 3.1l-1.36-.79a5.5 5.5 0 000-1.62l1.36-.79a.5.5 0 00.18-.68l-1.5-2.6a.5.5 0 00-.68-.18l-1.36.79a5.5 5.5 0 00-1.4-.81l-.26-1.55A.5.5 0 0010 0H7a.5.5 0 00-.5.42L6.24 1.97a5.5 5.5 0 00-1.4.81L3.48 2a.5.5 0 00-.68.18l-1.5 2.6a.5.5 0 00.18.68l1.36.79a5.5 5.5 0 000 1.62l-1.36.79a.5.5 0 00-.18.68l1.5 2.6a.5.5 0 00.68.18l1.36-.79a5.5 5.5 0 001.4.81l.26 1.55A.5.5 0 007 16h3a.5.5 0 00.5-.42l.26-1.55a5.5 5.5 0 001.4-.81l1.36.79a.5.5 0 00.68-.18l1.5-2.6a.5.5 0 00-.18-.68z"/>
          </svg>
        </button>
      </header>

      <main>
        <textarea
          id="input"
          placeholder="Paste or type text to count..."
          spellcheck="false"
          autocomplete="off"
        ></textarea>
      </main>

      <section id="display">
        <div class="hero">
          <span id="tokens" class="tokens">—</span>
          <span class="tokens-label">tokens</span>
        </div>
        <div class="meta">
          <span id="cost">no estimate</span>
          <button id="count-btn">Count <span aria-hidden="true">→</span></button>
        </div>
      </section>

      <div id="status" role="status" aria-live="polite"></div>
    </div>

    <dialog id="settings-dialog">
      <h2>API Key</h2>
      <p class="hint">
        Stored in your OS keychain (macOS Keychain / Windows Credential Manager).
        Get a key at <span class="mono">console.anthropic.com</span>.
      </p>
      <label for="api-key">Anthropic API key</label>
      <input
        id="api-key"
        type="password"
        placeholder="sk-ant-..."
        autocomplete="off"
        spellcheck="false"
      />
      <div class="dialog-buttons">
        <button id="clear-key" class="danger">Clear</button>
        <span class="spacer"></span>
        <button id="close-dialog">Cancel</button>
        <button id="save-key" class="primary">Save</button>
      </div>
    </dialog>

    <script src="main.js" type="module"></script>
  </body>
</html>
