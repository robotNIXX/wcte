<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Usage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <span class="app-title">Claude Usage</span>
        <span id="last-updated" class="last-updated"></span>
        <button id="pin-btn" title="Always on top" aria-label="Toggle always on top" aria-pressed="false">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor">
            <path d="M9.828.722a.5.5 0 0 1 .354.146l4.95 4.95a.5.5 0 0 1 0 .707c-.48.48-1.072.588-1.503.588-.177 0-.335-.018-.46-.039l-3.134 3.134a6 6 0 0 1 .16 1.013c.046.702-.032 1.687-.72 2.375a.5.5 0 0 1-.707 0l-2.829-2.828-3.182 3.182c-.195.195-1.219.902-1.414.707s.512-1.22.707-1.414l3.182-3.182-2.828-2.829a.5.5 0 0 1 0-.707c.688-.688 1.673-.767 2.375-.72a6 6 0 0 1 1.013.16l3.134-3.133a3 3 0 0 1-.04-.461c0-.43.108-1.022.589-1.503a.5.5 0 0 1 .353-.146"/>
          </svg>
        </button>
        <button id="refresh-btn" title="Refresh" aria-label="Refresh">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor">
            <path d="M13.65 2.35A8 8 0 1 0 15 8h-1.5a6.5 6.5 0 1 1-1.12-3.65L10 6.5h4.5V2l-2.85 2.85z"/>
          </svg>
        </button>
      </header>

      <main>
        <!-- 5-hour block -->
        <div class="usage-block">
          <div class="block-label">5-hour window</div>
          <div class="stat-row">
            <span id="fh-pct" class="stat-number">·</span>
            <span class="stat-unit">% used</span>
          </div>
          <div class="progress-wrap">
            <div class="progress-track">
              <div id="fh-bar" class="progress-fill"></div>
            </div>
            <span id="fh-resets" class="resets-label"></span>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 7-day block -->
        <div class="usage-block">
          <div class="block-label">7-day window</div>
          <div class="stat-row">
            <span id="sd-pct" class="stat-number">·</span>
            <span class="stat-unit">% used</span>
          </div>
          <div class="progress-wrap">
            <div class="progress-track">
              <div id="sd-bar" class="progress-fill"></div>
            </div>
            <span id="sd-resets" class="resets-label"></span>
          </div>
        </div>
      </main>

      <footer>
        <span id="last-updated-label" class="last-updated-label"></span>
        <span id="status" role="status" aria-live="polite"></span>
      </footer>
    </div>

    <script src="main.js" type="module"></script>
  </body>
</html>
